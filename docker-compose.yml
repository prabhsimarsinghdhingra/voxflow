# Needs Docker Desktop with WSL2 + NVIDIA GPU support (or Linux + nvidia-container-toolkit)
services:
  vllm:
    image: vllm/vllm-openai:latest
    command: ["--model", "Qwen/Qwen2.5-1.5B-Instruct", "--max-model-len", "4096", "--gpu-memory-utilization", "0.85"]
    ports: ["8001:8000"]
    ipc: host
    volumes: ["hf-cache:/root/.cache/huggingface"]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      VLLM_URL: http://vllm:8000/v1
      VLLM_MODEL: Qwen/Qwen2.5-1.5B-Instruct
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://vox:vox@db:5432/vox
    depends_on: [vllm, redis, db]
  redis:
    image: redis:7-alpine
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vox, POSTGRES_PASSWORD: vox, POSTGRES_DB: vox }
volumes: { hf-cache: {} }
